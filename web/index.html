<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Required so phones report real width (~390) instead of ~980 desktop layout. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LedgerOne — personal expense tracker for Android, iOS, and Web.">
  <meta name="theme-color" content="#2563EB">
  <!-- Google Sign-In (Web OAuth client from Firebase) -->
  <!-- Must match PlatformIds.googleWebClientId (Firebase Web OAuth client). -->
  <meta name="google-signin-client_id" content="293916450719-9muqkj0gjspieqoumad04kqcius43q21.apps.googleusercontent.com">
  <!-- Build stamp: forces browsers past stale HTML/SW caches. -->
  <meta name="ledgerone-build" content="2026-08-07-production-hardening">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LedgerOne">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LedgerOne</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Bust old Flutter service-worker caches so users get the latest UI. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
